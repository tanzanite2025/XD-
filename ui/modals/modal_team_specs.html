<!-- 弹窗: 独立班组主数据配置字典 -->
<div id="modal-team-specs" class="uds-modal-backdrop">
  <div class="uds-dialog" style="width: 620px;">
    <div class="uds-glow-gradient"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <h2 class="uds-header-title">独立生产班组主数据</h2>
        <span class="uds-badge uds-badge-healthy">独立从属字典</span>
      </div>
      <button type="button" class="uds-btn-ghost btn-close-modal" style="padding: 4px 10px;">关闭</button>
    </div>

    <p class="uds-desc" style="margin-bottom: 16px; color: var(--primary);">
      班组作为独立核算与从属数据池，独立于三级树形架构。记工台支持选择班组进行全班集体计件均摊，也可直接选择员工进行个人记工。
    </p>

    <!-- 录入新增班组表单 -->
    <div style="background: rgba(0,0,0,0.02); border-radius: 16px; border: 1px dashed var(--border-dashed); padding: 14px; margin-bottom: 16px;">
      <div class="uds-label" style="margin-bottom: 8px;">录入新增独立班组</div>
      <div style="display: grid; grid-template-columns: 120px 1fr 100px auto; gap: 10px; align-items: center;">
        <input id="input-new-team-code" type="text" class="uds-input uds-mono" placeholder="班组代码 (如 TM-07)" style="height: 40px;">
        <input id="input-new-team-name" type="text" class="uds-input" placeholder="班组名称 (如 涂装三班)" style="height: 40px;">
        <input id="input-new-team-leader" type="text" class="uds-input" placeholder="班长 (选填)" style="height: 40px;">
        <button type="button" id="btn-submit-add-team" class="uds-btn-primary" style="height: 40px; padding: 0 16px; white-space: nowrap;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          新增班组
        </button>
      </div>
    </div>

    <!-- 班组列表 -->
    <div class="uds-label" style="margin-bottom: 8px; display: flex; justify-content: space-between;">
      <span>当前班组字典与在职人数</span>
      <span id="team-specs-count-badge" class="uds-mono" style="color: var(--primary);">0 个班组</span>
    </div>

    <div style="max-height: 260px; overflow-y: auto; background: #ffffff; border-radius: 16px; border: 1px solid var(--border-dashed);">
      <table class="uds-table" style="width: 100%;">
        <thead>
          <tr>
            <th style="padding: 8px 12px; font-size: 11px;">代码</th>
            <th style="padding: 8px 12px; font-size: 11px;">班组名称</th>
            <th style="padding: 8px 12px; font-size: 11px;">班组长</th>
            <th style="padding: 8px 12px; font-size: 11px; text-align: center;">在册员工</th>
            <th style="padding: 8px 12px; font-size: 11px; text-align: right;">操作</th>
          </tr>
        </thead>
        <tbody id="team-specs-table-body">
          <!-- 动态渲染班组 -->
        </tbody>
      </table>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--border-dashed);">
      <button type="button" class="uds-btn-primary btn-close-modal" style="height: 38px; padding: 0 24px;">完成并返回</button>
    </div>
  </div>
</div>
