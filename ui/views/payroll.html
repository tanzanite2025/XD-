<!-- 标签页 4: 薪酬核算与对账台 -->
<section id="tab-payroll" class="tab-content" style="display: none; flex-direction: column; gap: 24px;">
  <div class="uds-toolbar" style="justify-content: space-between;">
    <div class="uds-toolbar-group">
      <span class="uds-label">核算周期</span>
      <input id="payroll-start-date" type="date" class="uds-input" style="min-width: 130px; max-width: 150px; height: 38px;">
      <span class="uds-mono">至</span>
      <input id="payroll-end-date" type="date" class="uds-input" style="min-width: 130px; max-width: 150px; height: 38px;">
      <select id="payroll-station-filter" class="uds-select" style="min-width: 160px; max-width: 200px; height: 38px;">
        <option value="">全厂工位统一汇总</option>
      </select>
      <button id="btn-query-payroll" class="uds-btn-primary" style="height: 38px;">
        计算核算汇总
      </button>
    </div>

    <div class="uds-toolbar-actions">
      <button id="btn-batch-settle" class="uds-btn-secondary" style="height: 38px;" title="锁定所选周期的报工流水">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        一键结算锁定
      </button>
      <button id="btn-export-payroll-csv" class="uds-btn-primary" style="height: 38px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        导出薪酬总账 (表格)
      </button>
      <button id="btn-print-payroll" class="uds-btn-secondary" style="height: 38px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        打印部门结算单 (A4)
      </button>
    </div>
  </div>

  <!-- 工位产量与工价成本汇总看板 -->
  <div class="uds-card uds-table-card">
    <div style="padding: 20px 24px; border-bottom: 1px dashed var(--border-dashed); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <h2 class="uds-card-title">各车间工位产量与工费成本汇总</h2>
      <div style="display: flex; align-items: center; gap: 10px;">
        <button id="btn-print-stations-report" class="uds-btn-secondary" style="height: 32px; padding: 0 14px; font-size: 9px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          打印工位报表 (A4)
        </button>
        <button id="btn-export-station-csv" class="uds-btn-secondary" style="height: 32px; padding: 0 14px; font-size: 9px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          导出工位成本表 (表格)
        </button>
        <span class="uds-badge uds-badge-healthy">工位指标汇总</span>
      </div>
    </div>
    <div class="uds-table-scroll">
      <table class="uds-table">
        <thead>
          <tr>
            <th style="width: 120px;">工位代码</th>
            <th style="width: 190px;">工位名称</th>
            <th style="width: 140px;">所属工段</th>
            <th style="width: 120px;">责任班长</th>
            <th style="width: 120px; text-align: right;">合格总产出</th>
            <th style="width: 110px; text-align: right;">废品件数</th>
            <th style="width: 150px; text-align: right;">工位工费总支出</th>
            <th style="width: 100px; text-align: right;">流水笔数</th>
          </tr>
        </thead>
        <tbody id="station-summary-table-body">
          <!-- 动态渲染 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 员工薪酬核算汇总表 -->
  <div class="uds-card uds-table-card">
    <div style="padding: 20px 24px; border-bottom: 1px dashed var(--border-dashed); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <h2 class="uds-card-title">员工计件薪酬总账明细</h2>
      <span class="uds-badge uds-badge-healthy">精准薪酬核算</span>
    </div>
    <div class="uds-table-scroll">
      <table class="uds-table">
        <thead>
          <tr>
            <th style="width: 120px;">员工工号</th>
            <th style="width: 130px;">姓名</th>
            <th style="width: 140px;">所属班组</th>
            <th style="width: 170px;">常驻主工位</th>
            <th style="width: 90px; text-align: right;">记工笔数</th>
            <th style="width: 110px; text-align: right;">合格件数</th>
            <th style="width: 100px; text-align: right;">废品数</th>
            <th style="width: 140px; text-align: right;">应发计件工资</th>
            <th style="width: 100px; text-align: center;">已结算笔数</th>
            <th style="width: 100px; text-align: center;">待核算笔数</th>
          </tr>
        </thead>
        <tbody id="payroll-table-body">
          <!-- 动态渲染 -->
        </tbody>
      </table>
    </div>
  </div>
</section>
