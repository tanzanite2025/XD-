<!-- 标签页 3: 工艺与工价版本库 -->
<section id="tab-processes" class="tab-content" style="display: none; flex-direction: column; gap: 24px;">
  <div class="uds-toolbar" style="justify-content: space-between;">
    <div class="uds-toolbar-group">
      <span class="uds-label">工艺检索</span>
      <input id="search-process" type="text" class="uds-input" placeholder="搜索工艺代码、名称或规格..." style="min-width: 180px; max-width: 260px; height: 38px;">
      <select id="filter-proc-station" class="uds-select" style="min-width: 160px; max-width: 220px; height: 38px;">
        <option value="">全部推荐工位</option>
      </select>
    </div>
    <div class="uds-toolbar-actions">
      <button id="btn-open-add-process" class="uds-btn-primary" style="height: 38px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        新增产品工艺与初始工价
      </button>
    </div>
  </div>

  <div class="uds-table-container">
    <table class="uds-table">
      <thead>
        <tr>
          <th style="width: 140px;">工艺代码</th>
          <th style="width: 230px;">工艺名称</th>
          <th style="width: 140px;">适用规格型号</th>
          <th style="width: 130px;">所属工段</th>
          <th style="width: 170px;">推荐作业工位</th>
          <th style="width: 110px; text-align: right;">当前单价 (元)</th>
          <th style="width: 170px;">最新工价版本说明</th>
          <th style="width: 90px; text-align: center;">状态</th>
          <th style="width: 160px; text-align: center;">操作</th>
        </tr>
      </thead>
      <tbody id="processes-table-body">
        <!-- 动态渲染 -->
      </tbody>
    </table>
  </div>
</section>
